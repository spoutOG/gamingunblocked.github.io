<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS.css">
  <title>G@ming Hub - Settings</title>
  <link rel="icon" href="icon.png" type="image/x-icon">
</head>
<body>

  <div class="sidebar">
    <h2 class="sidebar-title">G@ming Hub</h2>
    <ul>
      <li><a href="index.html"><i class="fa fa-home"></i> Home</a></li>
      <li><a href="about.html"><i class="fa fa-info-circle"></i> About</a></li>
      <li><a href="cs.html"><i class="fa fa-clock-o"></i> Coming Soon</a></li>
      <li class="active"><a href="settings.html"><i class="fa fa-cog"></i> Settings</a></li>
      <li><a href="reposongit.html"><i class="fa fa-github"></i> Repos (GH)</a></li>
    </ul>
  </div>

  <div class="with-sidebar">
    <main>
      
      <div class="settings-panel fade-in-up">
        <h2>Settings</h2>

        <div class="setting-row">
          <span class="setting-label">Theme</span>
          <select class="setting-select" id="theme-select" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
            <option value="default">Default Dark</option>
            <option value="light">Light</option>
            <option value="moonlight">Moonlight</option>
            <option value="sandy">Sunshine</option>
            <option value="coffee">Latte</option>
            <option value="forest">Forest</option>
          </select>
        </div>
        <i class="fa fa-info-circle"><p class="txt">Some themes are in beta, and so are most new settings</p></i>
      </div>
    </main>

  </div>

  <script src="script.js"></script>
</body>
