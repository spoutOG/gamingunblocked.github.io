<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS.css">
  <title>G@ming Hub - Settings</title>
  <link rel="icon" href="icon.png" type="image/x-icon">
</head>
<body>

  <div class="sidebar">
    <h2 class="sidebar-title">G@ming Hub</h2>
    <ul>
      <li><a href="index.html"><i class="fa fa-home"></i> Home</a></li>
      <li><a href="about.html"><i class="fa fa-info-circle"></i> About</a></li>
      <li><a href="cs.html"><i class="fa fa-clock-o"></i> Coming Soon</a></li>
      <li class="active"><a href="settings.html"><i class="fa fa-cog"></i> Settings</a></li>
      <li><a href="reposongit.html"><i class="fa fa-github"></i> Repos (GH)</a></li>
    </ul>
  </div>

  <div class="with-sidebar">
    <main>
      
      <div class="settings-panel fade-in-up">
        <h2>Settings</h2>

        <div class="setting-row">
          <span class="setting-label">Dark Mode</span>
          <button class="setting-toggle" id="toggle-dark" aria-checked="false" role="switch">
            <span class="toggle-knob"></span>
          </button>
        </div>

        <div class="setting-row">
          <span class="setting-label">Reduce Motion</span>
          <button class="setting-toggle" id="toggle-motion" aria-checked="false" role="switch">
            <span class="toggle-knob"></span>
          </button>
        </div>

        <div class="setting-row">
          <span class="setting-label">Font Size</span>
          <select class="setting-select" id="font-select" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
            <option value="default">Default</option>
            <option value="font-large">Large</option>
            <option value="font-small">Small</option>
          </select>
        </div>

        <div class="setting-row">
          <span class="setting-label">High Contrast Mode</span>
          <button class="setting-toggle" id="toggle-contrast" aria-checked="false" role="switch">
            <span class="toggle-knob"></span>
          </button>
        </div>
        
        <div class="setting-row">
          <span class="setting-label">Theme</span>
          <select class="setting-select" id="theme-select" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
            <option value="default">Default</option>
            <option value="moonlight">Moonlight</option>
            <option value="sandy">Sandy</option>
            <option value="coffee">Coffee</option>
            <option value="forest">Forest</option>
          </select>
        </div>
        <i class="fa fa-info-circle"><p class="txt">Some themes are in beta, and so are most new settings</p></i>
      </div>
    </main>

    <footer class="footer">
      G@ming Hub v1.9 &copy; 2025
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
</div>
</main>
  <script src="script.js"></script>
  <script>
    // Dark mode toggle logic
    const darkBtn = document.getElementById('toggle-dark');
    if (darkBtn) {
      const updateDarkToggle = () => {
        const isDark = document.body.classList.contains('dark-mode');
        darkBtn.setAttribute('aria-checked', isDark);
      };

      darkBtn.addEventListener('click', () => {
        // Assuming myFunction() is your function in script.js that toggles the class
        if (typeof myFunction === 'function') {
          myFunction(); 
        }
        updateDarkToggle();
      });

      // Initialize on load
      updateDarkToggle();
    }

    // Reduce motion toggle logic
    const motionBtn = document.getElementById('toggle-motion');
    if (motionBtn) {
      const applyReduceMotion = (state) => {
        if (state) {
          document.body.classList.add('reduce-motion');
          localStorage.setItem('reduceMotion', 'enabled');
        } else {
          document.body.classList.remove('reduce-motion');
          localStorage.setItem('reduceMotion', 'disabled');
        }
        motionBtn.setAttribute('aria-checked', state);
      };

      motionBtn.addEventListener('click', () => {
        const isMotionReduced = !document.body.classList.contains('reduce-motion');
        applyReduceMotion(isMotionReduced);
      });

      // Initialize on load
      const reduceMotion = localStorage.getItem('reduceMotion') === 'enabled';
      applyReduceMotion(reduceMotion);
    }

    // Theme select logic
    const themeSelect = document.getElementById('theme-select');
    if (themeSelect) {
      const applyTheme = (theme) => {
        document.body.classList.remove('moonlight');
        if (theme === 'moonlight') {
          document.body.classList.add('moonlight');
        }
        localStorage.setItem('siteTheme', theme);
      };

      themeSelect.addEventListener('change', function() {
        applyTheme(this.value);
      });

      // Initialize on load
      const currentTheme = localStorage.getItem('siteTheme') || 'default';
      themeSelect.value = currentTheme;
      applyTheme(currentTheme);
    }
  </script>
</body>
</html>
